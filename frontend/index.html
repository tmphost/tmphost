<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tmphost.io</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Relative, like every href here: the Go server rewrites "./" under its base path. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="tmphost" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Apply the saved theme before first paint, so a dark page does not
      // flash white while the app loads. stores/themeStore.js owns it after.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (!dark) return
        document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#09090b')
      })()
    </script>
  </head>
  <body class="bg-zinc-50">
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
