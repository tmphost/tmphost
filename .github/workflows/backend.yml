name: Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  # The Makefile is in scope because mock generation lives there: a change to
  # it can break the build without touching backend/.
  pull_request:
    paths:
      - 'backend/**'
      - 'Makefile'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Tracks the toolchain the module declares rather than a second copy
          # of the version that would quietly drift from it.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install mockgen
        # The version is read from the module's own dependency on
        # github.com/golang/mock, so the generator and the gomock runtime the
        # tests link against cannot disagree.
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install "github.com/golang/mock/mockgen@$(go list -m -f '{{.Version}}' github.com/golang/mock)"
        working-directory: backend

      - name: Check mocks are up to date
        # Mocks are committed, so an interface change without `make mocks`
        # would leave tests passing against a stale mock.
        run: |
          make mocks
          git diff --exit-code -- backend

      - name: Build
        run: go build ./...
        working-directory: backend

      - name: Test with coverage
        # Mock packages are excluded: they are generated and would drag the
        # total down without saying anything about the code under test.
        run: go test -race -coverprofile=coverage.out $(go list ./... | grep -v /mocks)
        working-directory: backend

      - name: Enforce 100% coverage
        run: |
          go tool cover -func=coverage.out | awk '$3 != "100.0%"' | grep -v '^total:' && {
            echo "::error::backend coverage is below 100% for the functions above"
            exit 1
          }
          go tool cover -func=coverage.out | tail -1
        working-directory: backend
